name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            # Composer blocks the EOL Laravel versions this compatibility check
            # intentionally resolves. This only affects the disposable CI job.
            dependencies: '--prefer-lowest --no-security-blocking'
          - php: '8.3'
            dependencies: ''

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --prefer-dist --no-interaction ${{ matrix.dependencies }}
      - run: composer test
